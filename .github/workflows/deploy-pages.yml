name: Deploy to Cloudflare Pages (push)

# Push 到 master 即自动部署到 cf-manager Pages 项目（纯代码部署，不碰 D1/KV/密钥）。
# 需要在 fork 仓库 Settings → Secrets and variables → Actions 里添加：
#   CLOUDFLARE_API_TOKEN — Cloudflare API Token（需 Pages:Edit 权限）
# 首次提交本文件时若 Secret 还没加，部署步骤会因缺少凭证失败；加好 Secret 后在 Actions 里 Re-run 即可。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build
        working-directory: worker
        run: npm ci && npm run build

      # wrangler.toml 同时含有 main（Worker 入口）和 pages_build_output_dir 时，
      # `wrangler pages deploy` 会报配置校验错；且 [vars] 里的占位值会覆盖
      # Dashboard 上真正的 API_SECRET / ENCRYPTION_KEY。做法与仓库自带的
      # deploy-cf Action 一致：部署前在 CI 里去掉这两项（只改检出副本，不提交回仓库）。
      # 另外 wrangler.toml 里的 D1/KV 还是占位符（YOUR_D1_DATABASE_ID /
      # YOUR_KV_NAMESPACE_ID），发布 Function 时会被校验拒绝；这里填入
      # cf-manager 项目实际绑定的 D1/KV ID（取自 Dashboard 项目配置，不是密钥）。
      - name: Prepare wrangler.toml for Pages deploy
        working-directory: worker
        run: |
          sed -i '/^main = /d' wrangler.toml
          sed -i '/^\[vars\]/,/^$/d' wrangler.toml
          sed -i 's/database_id = ".*"/database_id = "81a66f64-0dc1-4b41-b553-93bddaf0a170"/' wrangler.toml
          sed -i 's/id = "YOUR_KV_NAMESPACE_ID"/id = "409677493a5c4871a6f21695873ea87d"/' wrangler.toml

      - name: Deploy to Cloudflare Pages
        working-directory: worker
        run: wrangler pages deploy --project-name cf-manager --branch main --commit-dirty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 明确指定帐户 ID，跳过 wrangler 的帐户查找（仅 Pages:Edit 的 Token
          # 没有列出帐户的权限，查不到帐户 ID 会直接报错）。
          # 这是 cf-manager Pages 项目所在的帐户（Dashboard URL 里的 account ID），不是密钥。
          CLOUDFLARE_ACCOUNT_ID: fd02099edc8f06e2147c17c6e17d04c6
